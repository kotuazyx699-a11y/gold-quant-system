name: Gold Quant V9 Autonomous Engine

on:
  schedule:
    - cron: '*/15 * * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-quant-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas numpy requests openai

      - name: Run Gold Quant Engine V11
        env:
          THAILLM_API_KEY: ${{ secrets.THAILLM_API_KEY }}
        run: |
          python backend/engine.py --no-startup-alert

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ knowledge_base/
          git diff --staged --quiet || git commit -m "Auto-update Gold Quant V11 [skip ci]"
          git pull --rebase --autostash origin main
          git push