name: Gold Quant V9 Autonomous Engine

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-quant-engine:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Install Python Libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Run Gold Quant V9 Engine
        env:
          THAILLM_API_KEY: ${{ secrets.THAILLM_API_KEY }}
        run: |
          python backend/engine.py --no-startup-alert

      - name: 5. Save & Push State, Hydra Vault & Journal
        run: |
          git config user.name "GoldQuantBot"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase origin main || true
          git add data/ knowledge_base/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update Gold Quant V9 [skip ci]"
            git push
          fi
