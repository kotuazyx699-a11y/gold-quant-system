name: Gold Quant V12 Autonomous Engine

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: gold-quant-engine
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-quant-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Run Gold Quant & Self-Learning V12
        env:
          THAILLM_API_KEY: ${{ secrets.THAILLM_API_KEY }}
        run: |
          python backend/engine.py --no-startup-alert

      - name: Commit and push updated data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Gold Quant Bot"
          git add data/ knowledge_base/
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update Gold Quant V12 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin main
            git push
          fi