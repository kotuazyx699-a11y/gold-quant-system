name: Update Gold Quant V14.0 Every 15 Minutes

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-quant-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pandas numpy yfinance requests openai

      - name: Run Gold Quant V14.0 Engine
        env:
          THAILLM_API_KEY: ${{ secrets.THAILLM_API_KEY }}
          NTFY_TOPIC: pansakorn888
        run: |
          python backend/engine.py --no-startup-alert

      - name: Commit & Push updated state
        run: |
          git config --global user.name "GoldQuantBot"
          git config --global user.email "bot@goldquant.local"
          git add data/state.json data/mue_memory.json data/scalp_journal.json data/trade_journal.json data/gold_m15_vault.csv
          git diff --staged --quiet || git commit -m "Auto-update XAU/USD V14.0 [skip ci]"
          git pull --rebase --autostash origin main
          git push origin main
