name: Gold Quant V18 Autonomous 15-Min Alert

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  quant-ntfy-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Spot XAU/USD Quant & Push ntfy Alert
        run: |
          python3 - << 'EOF'
          import urllib.request
          import json
          from datetime import datetime, timezone, timedelta

          NTFY_TOPIC = "pansakorn888"
          bkk_now = datetime.now(timezone(timedelta(hours=7))).strftime("%H:%M:%S")

          # 1. Fetch True Spot XAU/USD (US-accessible global endpoint)
          spot = 0.0
          try:
              req = urllib.request.Request("https://api.gold-api.com/price/XAU", headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=10) as r:
                  data = json.loads(r.read().decode())
                  spot = float(data.get("price", 0))
          except Exception as e:
              print("Gold-API err:", e)

          # 2. Fetch 15m OHLC from Kraken PAXG/USD (US-accessible) for ATR & EMA21 trend
          closes, highs, lows = [], [], []
          try:
              req2 = urllib.request.Request("https://api.kraken.com/0/public/OHLC?pair=PAXGUSD&interval=15", headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req2, timeout=10) as r2:
                  j2 = json.loads(r2.read().decode())
                  res_key = [k for k in j2.get("result", {}).keys() if k != "last"][0]
                  candles = j2["result"][res_key][-60:]
                  for c in candles:
                      highs.append(float(c[2]))
                      lows.append(float(c[3]))
                      closes.append(float(c[4]))
          except Exception as e:
              print("Kraken err:", e)

          if spot <= 0 and closes:
              spot = closes[-1]

          if closes and len(closes) >= 21:
              ema21 = closes[0]
              k = 2 / 22.0
              for px in closes[1:]:
                  ema21 = px * k + ema21 * (1 - k)
              trs = [max(highs[i] - lows[i], abs(highs[i] - closes[i-1]), abs(lows[i] - closes[i-1])) for i in range(-14, 0)]
              atr = sum(trs) / len(trs)
              # Align EMA21 to Spot basis
              ema21_spot = ema21 + (spot - closes[-1])
              trend = "BEAR (SHORT)" if spot < ema21_spot else "BULL (LONG)"
              sl_dist = max(4.5, min(8.5, round(atr * 0.40, 2)))
              tp_dist = round(sl_dist * 1.8, 2)
              if spot < ema21_spot:
                  entry = round(spot + 2.80, 2)
                  sl = round(entry + sl_dist, 2)
                  tp = round(entry - tp_dist, 2)
                  side = "SHORT"
              else:
                  entry = round(spot - 2.80, 2)
                  sl = round(entry - sl_dist, 2)
                  tp = round(entry + tp_dist, 2)
                  side = "LONG"

              msg = (
                  f"เวลา {bkk_now} น. (BKK)\n"
                  f"Spot XAU/USD: ${spot:.2f} | แนวโน้ม: {trend}\n"
                  f"EMA21: ${ema21_spot:.2f} | ATR(14): ${atr:.2f}\n"
                  f"แผน Near-Spot Scalp ({side}):\n"
                  f"Entry: ${entry:.2f} | SL: ${sl:.2f} | TP: ${tp:.2f}"
              )
          else:
              msg = f"เวลา {bkk_now} น. (BKK) | Spot XAU/USD: ${spot:.2f}"

          req_ntfy = urllib.request.Request(
              f"https://ntfy.sh/{NTFY_TOPIC}",
              data=msg.encode("utf-8"),
              headers={
                  "Title": f"XAU/USD 15m Report (${spot:.2f})",
                  "Priority": "4",
                  "Tags": "chart_with_upwards_trend"
              },
              method="POST"
          )
          with urllib.request.urlopen(req_ntfy, timeout=10) as resp:
              print("ntfy status:", resp.status)
          EOF
