name: Gold Quant V18 Autonomous 15-Min Engine (Monte Carlo 1M) + Alert

# รวมทุกอย่างไว้ในไฟล์เดียว: รัน backend/engine.py (Vector Grid + Monte Carlo 1,000,000 รอบ),
# อัปเดต data/state.json + journals แล้ว commit กลับเข้า repo และส่งแจ้งเตือน ntfy เองในตัว
# - รันอัตโนมัติทุก 15 นาที จันทร์-ศุกร์ (ไม่ต้องกด Run workflow เองอีก)
# - รันอัตโนมัติทันทีเมื่อมีการแก้ backend/engine.py หรือไฟล์ workflow นี้ (push)
on:
  schedule:
    - cron: '*/15 * * * 1-5'
  push:
    paths:
      - 'backend/engine.py'
      - '.github/workflows/update_quant.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gold-quant-engine
  cancel-in-progress: false

jobs:
  run-quant-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backend engine (Monte Carlo 1M + state.json + ntfy alert)
        env:
          NTFY_TOPIC: pansakorn888
          ACCOUNT_BALANCE: "1000"
          RISK_PER_TRADE_PCT: "1.0"
        run: python backend/engine.py

      - name: Commit & push updated state (data/state.json + journals)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json data/mue_memory.json data/scalp_journal.json data/trade_journal.json data/active_order.json data/macro_cache.json data/alert_state.json data/learning_weights.json
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "auto: engine cycle update (state.json + journals) [skip ci]"
            git pull --rebase --autostash
            git push
          fi

      - name: Notify on failure (ntfy)
        if: failure()
        env:
          NTFY_TOPIC: pansakorn888
        run: |
          python3 - << 'EOF'
          import os, urllib.request
          topic = os.environ.get("NTFY_TOPIC", "pansakorn888")
          msg = "GitHub Actions: Gold Quant engine cycle ล้มเหลว — ตรวจสอบ logs ล่าสุดใน repo"
          req = urllib.request.Request(
              f"https://ntfy.sh/{topic}",
              data=msg.encode("utf-8"),
              headers={"Title": "Gold Quant Engine FAILED", "Priority": "4", "Tags": "warning"},
              method="POST"
          )
          urllib.request.urlopen(req, timeout=10)
          print("failure alert sent")
          EOF
